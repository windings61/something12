<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daxil ol | YourDeal</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="wrapper">

    <a href="/" class="logo" aria-label="YourDeal ana səhifə">
      <img src="images/logo.png" alt="" width="50">
    </a>

    <section class="card">
      <h1>Daxil ol</h1>
      <p class="sub">Davam etmək üçün hesabına giriş et.</p>

      <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">E-poçt</label>
          <input type="email" id="email" name="email" placeholder="ad@mail.com" autocomplete="email" required>
          <div class="error-text" id="emailError"></div>
        </div>

        <div class="field">
          <label for="password">Şifrə</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Şifrəni daxil et" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="togglePass" aria-label="Şifrəni göstər">Göstər</button>
          </div>
          <div class="error-text" id="passwordError"></div>
        </div>

        <div class="row">
          <label class="remember" for="remember">
            <input type="checkbox" id="remember" name="remember">
            Məni xatırla
          </label>
          <a href="/forgot-password">Şifrəni unutmusan?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="submitBtn">Daxil ol</button>
      </form>

      <div class="divider">və ya</div>

      <button type="button" class="btn btn-outline" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/>
          <path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/>
          <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
        </svg>
        Google ilə davam et
      </button>

      <p class="signup">Hesabın yoxdur? <a href="/register">Qeydiyyatdan keç</a></p>
    </section>

    <p class="page-footer">© 2026 YourDeal. Bütün hüquqlar qorunur.</p>

  </main>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passError = document.getElementById('passwordError');
    const message = document.getElementById('formMessage');
    const submitBtn = document.getElementById('submitBtn');
    const togglePass = document.getElementById('togglePass');

    // Şifrəni göstər / gizlət
    togglePass.addEventListener('click', () => {
      const show = passInput.type === 'password';
      passInput.type = show ? 'text' : 'password';
      togglePass.textContent = show ? 'Gizlət' : 'Göstər';
      togglePass.setAttribute('aria-label', show ? 'Şifrəni gizlət' : 'Şifrəni göstər');
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'form-message show ' + type;
    }

    function setError(input, errorEl, text) {
      errorEl.textContent = text;
      input.classList.toggle('invalid', Boolean(text));
    }

    function validate() {
      let ok = true;
      const email = emailInput.value.trim();
      const password = passInput.value;

      if (!email) {
        setError(emailInput, emailError, 'E-poçt ünvanını daxil et.');
        ok = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setError(emailInput, emailError, 'E-poçt ünvanı düzgün deyil.');
        ok = false;
      } else {
        setError(emailInput, emailError, '');
      }

      if (!password) {
        setError(passInput, passError, 'Şifrəni daxil et.');
        ok = false;
      } else if (password.length < 6) {
        setError(passInput, passError, 'Şifrə ən azı 6 simvol olmalıdır.');
        ok = false;
      } else {
        setError(passInput, passError, '');
      }

      return ok;
    }

    emailInput.addEventListener('input', () => setError(emailInput, emailError, ''));
    passInput.addEventListener('input', () => setError(passInput, passError, ''));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = 'form-message';

      if (!validate()) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Gözlə...';

      try {
        // TODO: öz backend ünvanınla əvəz et
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: emailInput.value.trim(),
            password: passInput.value,
            remember: document.getElementById('remember').checked
          })
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          throw new Error(data.message || 'E-poçt və ya şifrə yanlışdır.');
        }

        showMessage('Uğurla daxil oldun! Yönləndirilirsən...', 'success');
        setTimeout(() => { window.location.href = '/dashboard'; }, 800);
      } catch (err) {
        showMessage(err.message || 'Xəta baş verdi. Bir az sonra yenidən yoxla.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Daxil ol';
      }
    });

    document.getElementById('googleBtn').addEventListener('click', () => {
      // TODO: Google OAuth axınını bura qoş
      showMessage('Google ilə giriş hələ qoşulmayıb.', 'error');
    });
  </script>
</body>
</html>
